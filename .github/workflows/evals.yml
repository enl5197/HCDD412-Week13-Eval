
name: evals

on:
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    name: evals
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install development dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Start mock LLM
      - name: Run tests, lint, and evaluations
        run: |
          set -euo pipefail

          # Start the mock LLM in the background.
          python mock_llm/server.py > mock-llm.log 2>&1 &

          # Wait 30 seconds for the health endpoint.
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/health > /dev/null; then
              echo "Mock LLM is healthy."
              break
            fi

            echo "Waiting for mock LLM... ($attempt/30)"
            sleep 1
          done

          # Fail if the mock LLM does not become healthy.
          if ! curl --fail --silent http://localhost:9000/health > /dev/null; then
            echo "Mock LLM failed to become healthy."
            cat mock-llm.log
            exit 1
          fi

          # Run test suite.
          python -m pytest

          # Check Python code for correct format.
          flake8 --max-line-length 100

          # Run evaluations against the saved baseline.
          python evals/run_evals.py --prompt-version v2 --baseline report-v2.json
